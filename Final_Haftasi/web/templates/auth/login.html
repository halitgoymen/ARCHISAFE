<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — ARCHISAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
    <div class="flash-message" data-category="{{ cat }}" style="display:none">{{ msg }}</div>
  {% endfor %}
{% endwith %}

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-mark">🏗️</div>
      <h1>ARCHISAFE</h1>
      <p>İnşaat Güvenlik Yönetim Sistemi</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">Kullanıcı Adı</label>
        <input type="text" name="username" class="form-control"
               placeholder="admin" autocomplete="username"
               value="{{ request.form.get('username', '') }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Şifre</label>
        <div style="position:relative">
          <input type="password" name="password" id="password-input"
                 class="form-control" placeholder="••••••••"
                 autocomplete="current-password" required
                 style="padding-right:42px">
          <button type="button" onclick="togglePassword()"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px"
                  id="eye-btn">👁️</button>
        </div>
      </div>

      <div class="flex items-center justify-between" style="margin-bottom:20px">
        <label class="form-check">
          <input type="checkbox" name="remember" value="1">
          <span style="font-size:13px; color:var(--text-secondary)">Beni hatırla</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg"
              style="justify-content:center; width:100%">
        🔐 Giriş Yap
      </button>
    </form>

    <div class="login-footer">
      <div style="margin-top:16px; padding:12px; background:rgba(255,255,255,.04); border-radius:8px; border:1px solid var(--border)">
        <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px">Demo Hesap</div>
        <div style="font-size:12px; font-weight:600">admin / admin123</div>
      </div>
      <div style="margin-top:16px">© 2025 ARCHISAFE — Yapay Zeka Destekli Güvenlik</div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
function togglePassword() {
  const input = document.getElementById('password-input');
  const btn   = document.getElementById('eye-btn');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else                           { input.type = 'password'; btn.textContent = '👁️'; }
}
</script>
</body>
</html>
